###############################
# Motrix Next Aria2 config file
#
# @see https://github.com/AnInsomniacy/aria2-next
#
###############################


################ RPC ################
# Enable JSON-RPC server.
enable-rpc=true
# Add Access-Control-Allow-Origin: * to RPC responses.
rpc-allow-origin-all=true
# Listen incoming JSON-RPC requests on all network interfaces.
rpc-listen-all=false


################ File system ################
# Checkpoint persistent engine state every SEC seconds.
state-save-interval=10
# Enable disk cache.
disk-cache=64M
# Specify file allocation method.
file-allocation=trunc
# No file allocation is made for files whose size is smaller than SIZE
no-file-allocation-limit=64M
# Save error/unfinished downloads to a file specified by --save-session option every SEC seconds.
save-session-interval=10


################ Task ################
# Exclude share-only P2P downloads when counting concurrent active downloads
detach-share-only=true
# Verify the peer using certificates specified in --ca-certificate option.
check-certificate=false
# If Aria2 Next receives "file not found" from a remote stream server NUM times
# without getting a single byte, then force the download to fail.
max-file-not-found=10
# Set number of tries.
max-tries=0
# Set the seconds to wait between retries. When SEC > 0, aria2 will retry downloads when the HTTP server returns a 503 response.
retry-wait=10
# Set the connection timeout for stream and proxy servers.
connect-timeout=10
# Set timeout in seconds.
timeout=10
# Send Accept: deflate, gzip request header.
http-accept-gzip=true
# Apply a remote HTTP/SFTP timestamp to the downloaded file when available.
remote-time=true
# Set interval in seconds to output download progress summary. Setting 0 suppresses the output.
summary-interval=0



################ BT Task ################
# Enable Local Peer Discovery.
bt-enable-lpd=true
# Prefer encrypted peer connections while accepting plain peers.
bt-encryption=preferred
# Specify the maximum number of peers per torrent.
bt-max-peers=128
# Prioritize file boundary pieces.
bt-first-last-piece-first=true
# Let libtorrent manage UPnP and NAT-PMP mappings.
bt-port-mapping=true
# Do not seed previously downloaded files before piece hash verification.
bt-seed-unverified=false
# Enable native IPv4 and IPv6 DHT.
enable-dht=true
# Enable Peer Exchange extension.
enable-peer-exchange=true
