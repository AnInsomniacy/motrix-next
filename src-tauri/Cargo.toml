[package]
name = "motrix-next"
version = "3.9.8-beta.2"
description = "A full-featured download manager"
authors = ["AnInsomniacy"]
license = "MIT"
edition = "2021"

[lib]
name = "motrix_next_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["macos-private-api", "tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-store = "2"
tauri-plugin-autostart = "2"
tauri-plugin-updater = "2.10.1"
tauri-plugin-deep-link = "2"
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-process = "2"
tauri-plugin-os = "2"
tauri-plugin-fs = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
semver = "1"
tokio = { version = "1", features = ["full"] }
log = "0.4"
thiserror = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-locale = "2.0.1"
url = "2.5.8"
tauri-plugin-window-state = "2.4.1"
igd-next = { version = "0.15", features = ["aio_tokio"] }
ipnet = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
tauri-plugin-log = "2.8.0"
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
dirs = "6"
zip = { version = "2", default-features = false, features = ["deflate"] }
chrono = "0.4"
trash = "5"
dunce = "1"
os_info = "3"
sys-locale = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
rfd = { version = "0.16", default-features = false }
maxminddb = { version = "0.27", features = ["mmap"] }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
keepawake = "0.6"
mime2ext = "0.1"
urlencoding = "2"
sanitize-filename = "0.6"
content_disposition = "0.4"
rfc2047-decoder = "1.1"
strip-ansi-escapes = "0.2.1"
tempfile = "3"
aes = "0.8"
cbc = { version = "0.1", features = ["alloc"] }
hex = "0.4"
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_Power",
    "Win32_System_Com",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_Shell_Common",
    "Win32_UI_WindowsAndMessaging",
] }
winreg = "0.56"

[target.'cfg(target_os = "linux")'.dependencies]
notify-rust = "4.14"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSWorkspace", "NSDockTile", "NSApplication"] }
objc2-foundation = { version = "0.3", features = ["NSURL", "NSString", "NSBundle"] }
core-foundation = "0.10"
system-configuration = "0.7.0"

[lints.clippy]
unwrap_used = "deny"
redundant_closure_for_method_calls = "warn"
