name: Android Release

# Builds the Android APK and publishes it to GitHub Releases.
#
# Triggered by:
#   - A `release: published` event with a tag matching the Android prefix
#   - Manual dispatch (workflow_dispatch)
#
# The workflow:
#   1. Runs `tauri android init` to generate the native Android project (gen/android).
#   2. Patches the AndroidManifest with the permissions the app needs
#      (POST_NOTIFICATIONS, INTERNET) and deep-link intent filters.
#   3. Builds the ARM64 APK with the bundled aria2-next Android sidecar.
#   4. Uploads the APK to the GitHub Release (or as a workflow artifact
#      when triggered manually).
#
# Only the `android` branch should trigger the release job.

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-android:
    # Android releases only fire from the `android` branch releases.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.release.target_commitish == 'android' ||
      startsWith(github.event.release.tag_name, 'android-') ||
      startsWith(github.event.release.tag_name, 'v')
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable

      - name: Add Android Rust target
        run: rustup target add aarch64-linux-android

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install Android SDK + NDK
        uses: android-actions/setup-android@v3
        with:
          ndk-version: 27.2.12479018
          cmdline-tools-version: 11076708

      - name: Resolve NDK home
        id: ndk
        run: |
          echo "NDK_HOME=${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/27.2.12479018}" >> "$GITHUB_ENV"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "NDK_HOME set to: ${ANDROID_NDK_LATEST_HOME:-$ANDROID_HOME/ndk/27.2.12479018}"

      - name: Install Linux system deps (WebKit only needed for checks)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential pkg-config

      - run: pnpm install --frozen-lockfile

      - name: Initialize Tauri Android project
        run: pnpm tauri android init

      - name: Patch AndroidManifest with permissions and deep links
        run: |
          MANIFEST="src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          # Inject permissions right after the opening <manifest> tag.
          python3 - <<'PY'
          import re

          manifest_path = "src-tauri/gen/android/app/src/main/AndroidManifest.xml"
          with open(manifest_path, "r", encoding="utf-8") as f:
              content = f.read()

          perms = """    <uses-permission android:name="android.permission.INTERNET" />
        <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
        <uses-permission android:name="android.permission.WAKE_LOCK" />
        <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />
        <uses-permission android:name="android.permission.READ_MEDIA_VIDEO" />
        <uses-permission android:name="android.permission.READ_MEDIA_IMAGES" />
        <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
"""

          if "android.permission.POST_NOTIFICATIONS" not in content:
              content = content.replace("<manifest ", perms + "<manifest ", 1)

          # Deep-link intent filters: magnet, ed2k, thunder, motrixnext
          deep_link_intent = """            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="magnet" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="ed2k" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="thunder" />
            </intent-filter>
            <intent-filter>
                <action android:name="android.intent.action.VIEW" />
                <category android:name="android.intent.category.DEFAULT" />
                <category android:name="android.intent.category.BROWSABLE" />
                <data android:scheme="motrixnext" />
            </intent-filter>
"""

          # Insert intent filters inside the <activity> element right after the
          # main activity's opening tag.
          if 'android:scheme="magnet"' not in content:
              # Find the <activity ...> opening tag (the first one that contains
              # MAIN launcher intent or just the first activity).
              match = re.search(r"<activity\b[^>]*>", content)
              if match:
                  content = content.replace(match.group(0), match.group(0) + deep_link_intent, 1)

          with open(manifest_path, "w", encoding="utf-8") as f:
              f.write(content)
          print("Manifest patched")
          PY

          echo "=== Manifest (permissions section) ==="
          grep -n "uses-permission\|scheme=\|intent-filter" "$MANIFEST" || true

      - name: Build Android APK
        run: pnpm tauri android build --apk --target aarch64
        env:
          NDK_HOME: "$ANDROID_NDK_LATEST_HOME"

      - name: Locate APK artifacts
        id: apk
        run: |
          echo "APK_DIR=src-tauri/gen/android/app/build/outputs/apk/universal/release" >> "$GITHUB_ENV"
          ls -la src-tauri/gen/android/app/build/outputs/apk/ 2>/dev/null || true
          find src-tauri/gen/android -name "*.apk" 2>/dev/null | head -20

      - name: Upload APK to Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.release.tag_name }}"
          # Copy APKs into a flat dir for the upload
          mkdir -p /tmp/apk-artifacts
          find src-tauri/gen/android -name "*.apk" -exec cp {} /tmp/apk-artifacts/ \;
          ls -la /tmp/apk-artifacts/
          # Upload each APK
          for apk in /tmp/apk-artifacts/*.apk; do
            echo "Uploading: $apk"
            gh release upload "$TAG" "$apk" --clobber
          done

      - name: Upload APK artifacts (manual trigger only)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v7
        with:
          name: motrix-next-android-apk
          path: |
            src-tauri/gen/android/**/*.apk
          retention-days: 14
